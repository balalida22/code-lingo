[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-lingo"
version = "1.1.2"
description = "A reading-first, daily programming language tutor for your terminal"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.package-data]
codelingo = ["courses/*.json"]

[tool.setuptools.packages.find]
include = ["codelingo*"]

[tool.uv]
package = false
